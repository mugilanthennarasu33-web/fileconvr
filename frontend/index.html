<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fileconvrt is a high-speed, privacy-first online PDF platform. Convert, merge, split, compress, rotate, OCR, repair, and protect your PDF documents with zero logging." />
    <meta name="keywords" content="PDF converter, merge PDF, compress PDF, split PDF, PDF to Word, Word to PDF, JPG to PDF, OCR PDF, protect PDF, repair PDF" />
    <meta name="author" content="Fileconvrt" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Google Fonts (Parallel Non-Blocking Fetch) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Canonical URL (Self-Referencing per Tool Page) -->
    <link rel="canonical" href="https://www.fileconvrt.site/" />
    <script>
      (function() {
        try {
          var link = document.querySelector('link[rel="canonical"]');
          if (link && window.location) {
            var path = window.location.pathname;
            var clean = (!path || path === '/') ? '/' : path.replace(/\/+$/, '');
            link.href = 'https://www.fileconvrt.site' + clean;
          }
        } catch (e) {}
      })();
    </script>

    <!-- Google Search Console Verification -->
    <meta name="google-site-verification" content="google8d120d917c1990a8" />

    <!-- Open Graph / Facebook / LinkedIn -->

    <meta property="og:site_name" content="Fileconvrt" />
